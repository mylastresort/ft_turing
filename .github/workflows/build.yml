name: Build ft_turing
on: [push]
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tree
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc build-essential curl unzip bubblewrap make
          bash -c "sh <(curl -fsSL https://opam.ocaml.org/install.sh) --download-only"
          sudo mv opam* /usr/local/bin/opam
          chmod +x /usr/local/bin/opam
      - name: Build project
        run: make
